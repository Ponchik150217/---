        body {
            margin: 0;
            min-height: 100vh;

            text-align: center;

                #25113d

            background-size: 400% 400%;
            animation: backgroundMove 12s ease infinite;
        }

        @keyframes backgroundMove {
            0% {

            }

            }

        }

            line-height: 1.5;
        }

        .button {
            display: inline-block;
            width: 300px;
            padding: 18px;
            margin: 15px;

            background: linear-gradient(135deg, #5865f2, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 15px;

            font-size: 18px;
            font-weight: bold;

            box-shadow: 0 8px 25px rgba(80, 80, 255, 0.35);
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 15px 35px rgba(130, 90, 255, 0.7);
        }

        .youtube-button {
            display: block;
            margin: 30px auto;
        }

        .buttons-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
    </style>
</head>
