<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art_Vedio_2017_15</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;

            background: linear-gradient(
                135deg,
                #0b1020,
                #17122b,
                #071d2b,
                #1a1026
            );

            background-size: 400% 400%;
            animation: backgroundMove 12s ease infinite;
        }

        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            text-align: center;
            padding: 70px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            margin-bottom: 25px;
            color: #d8d8e8;
        }

        .button {
            display: inline-block;
            width: 280px;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            text-align: center;
            background: linear-gradient(135deg, #4e5bd5, #7b3fe4);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 10px 30px rgba(100, 80, 255, 0.5);
        }

        /* Кнопка YouTube */
        .youtube {
            margin-top: 10px;
        }

        /* Контейнер для двух нижних кнопок */
        .lower-buttons {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 160px;
            margin: 10px auto 0;
        }

        /* Заявка — левее */
        .apply {
            position: absolute;
            left: 0;
            top: 55px;

            background: linear-gradient(135deg, #16844a, #24b867);
        }

        /* Пожертвовать — выше и правее */
        .donate {
            position: absolute;
            right: 0;
            top: 5px;

            background: linear-gradient(135deg, #c97800, #e69b00);
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 32px;
            }

            p {
                font-size: 17px;
            }

            .lower-buttons {
                height: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .apply,
            .donate {
                position: static;
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Здравствуйте!</h1>

        <p>Вы попали на сайт Art_Vedio_2017_15</p>

        <p>
            Вы сможете продвинуть Art_Vedio, если подадите заявку на сотрудничество.
        </p>

        <!-- YouTube -->
        <a
            href="https://youtube.com/channel/UCfc06WWWemdGtQDNxkW9zLQ?si=WSzg9uelOq-6YK7S"
            class="button youtube"
            target="_blank"
        >
            ▶ Art_Vedio_2017_15
        </a>

        <div class="lower-buttons">

            <!-- Заявка слева -->
            <a
                href="https://discord.gg/RGjsDS7Ra"
                class="button apply"
                target="_blank"
            >
                🤝 Подать заявку на сотрудничество
            </a>

            <!-- Пожертвование выше и справа -->
            <a
                href="https://www.donationalerts.com/r/art9vedio9official"
                class="button donate"
                target="_blank"
            >
                💰 Пожертвовать
            </a>

        </div>

    </div>

</body>
</html>
