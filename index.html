<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Art_Vedio_2017_15</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;

      background:
        radial-gradient(circle at top left, #313b5c 0%, transparent 35%),
        radial-gradient(circle at bottom right, #332451 0%, transparent 35%),
        linear-gradient(135deg, #15171f, #252936, #181923);

      background-attachment: fixed;
    }

    .container {
      padding-top: 70px;
      width: 100%;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
      text-shadow: 0 0 20px rgba(120, 100, 255, 0.4);
    }

    p {
      font-size: 20px;
      color: #d0d2dc;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      width: 300px;
      padding: 20px;
      margin: 15px;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      color: white;
      border-radius: 12px;

      background: linear-gradient(135deg, #5865f2, #7b61ff);

      box-shadow: 0 8px 25px rgba(88, 101, 242, 0.3);

      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(88, 101, 242, 0.5);
    }

    .youtube-button {
      display: block;
      margin: 20px auto;
    }

    .buttons-row {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .donate-button {
      background: linear-gradient(135deg, #167a72, #249c8d);
      box-shadow: 0 8px 25px rgba(36, 156, 141, 0.25);
    }

    .donate-button:hover {
      box-shadow: 0 12px 30px rgba(36, 156, 141, 0.5);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Здравствуйте!</h1>

    <p>Вы попали на сайт Art_Vedio_2017_15</p>

    <!-- Кнопка YouTube -->
    <a class="button youtube-button"
       href="https://youtube.com/channel/UCfc06WWWemdGtQDNxkW9zLQ?si=WSzg9uelOq-6YK7S"
       target="_blank">
      ▶️ Art_Vedio_2017_15
    </a>

    <!-- Здесь позже можно добавить ещё одну кнопку -->

    <div class="buttons-row">

      <!-- Подать заявку -->
      <a class="button"
         href="https://discord.gg/RGjsDS7Ra"
         target="_blank">
        🤝 Подать заявку
      </a>

      <!-- Пожертвовать -->
      <a class="button donate-button"
         href="https://www.donationalerts.com/r/art9vedio9official"
         target="_blank">
        💰 Пожертвовать
      </a>

    </div>

  </div>

</body>
</html>
